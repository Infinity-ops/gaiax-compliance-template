name: Lint (tooling self-test)

# Proves the generation/signing/validation PIPELINE ITSELF is sound, using
# the filled fixture in tests/fixtures/ — independent of whether this
# repo's own gaiax.config.yaml (a template, shipped with REPLACE_ME
# placeholders for users to fill in) is complete.
#
# This is the workflow the README badge points to: it should always be
# green on a healthy main branch. Contrast with validate.yml, which checks
# gaiax.config.yaml completeness — that one is EXPECTED to fail on a fresh
# copy of this template, and passes only once a real user has filled in
# their own config. Don't confuse the two.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "scripts/**"
      - "gaiax/templates/**"
      - "tests/fixtures/**"
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate the example fixture (should always pass)
        env:
          GAIAX_CONFIG_PATH: tests/fixtures/example.config.yaml
          GAIAX_MAPPING_PATH: tests/fixtures/example.mapping.yaml
        run: python scripts/validate_local.py

      - name: Render every template against the fixture
        env:
          GAIAX_CONFIG_PATH: tests/fixtures/example.config.yaml
        run: |
          python - <<'PYEOF'
          import json, sys
          sys.path.insert(0, "scripts")
          from _config import load_config, render_template

          cfg = load_config()

          def render_and_check(path, extra=None):
              with open(path) as f:
                  text = f.read()
              rendered = render_template(text, cfg, extra or {})
              json.loads(rendered)
              print(f"OK: {path}")

          render_and_check("gaiax/templates/legal-participant.jsonld")
          render_and_check("gaiax/templates/terms-and-conditions.jsonld")

          for offering in cfg.get("service_offerings", []):
              extra = {
                  "offering_id": offering["id"],
                  "offering_name": offering["name"],
                  "offering_description": offering["description"],
                  "offering_data_account_export.request_type": offering["data_account_export"]["request_type"],
                  "offering_data_account_export.access_type": offering["data_account_export"]["access_type"],
                  "offering_data_account_export.format": offering["data_account_export"]["format"],
                  "offering_produces_resources": offering.get("produces_resources", []),
              }
              render_and_check("gaiax/templates/service-offering.jsonld", extra)

          for resource in cfg.get("data_resources") or []:
              extra = {
                  "resource_id": resource["id"],
                  "resource_name": resource["name"],
                  "resource_description": resource["description"],
                  "resource_format": resource["format"],
                  "produced_by": resource["produced_by"],
                  "resource_owner": resource["owner"],
                  "resource_retention_claim": resource["retention_claim"],
                  "resource_retention_evidence": resource["retention_evidence"],
                  "resource_export_mechanism": resource["export_mechanism"],
              }
              render_and_check("gaiax/templates/data-resource.jsonld", extra)

          print("All templates render to valid JSON against the fixture.")
          PYEOF

      - name: Confirm shipped gaiax.config.yaml is still a clean, unfilled template
        run: |
          python - <<'PYEOF'
          import sys
          sys.path.insert(0, "scripts")
          from _config import load_config, find_unfilled_placeholders

          cfg = load_config()
          unfilled = find_unfilled_placeholders(cfg)
          if not unfilled:
              print("::error::gaiax.config.yaml has no REPLACE_ME placeholders left — "
                    "did real data get committed to the template by accident? "
                    "Check before merging.")
              sys.exit(1)
          print(f"OK: shipped template config still has {len(unfilled)} "
                f"placeholder field(s), as expected for a fresh template.")
          PYEOF
